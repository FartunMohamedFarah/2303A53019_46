<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Weather Dashboard</h1>

    <section id="current-weather" class="card">
      <h2>Current Weather</h2>
      <div id="current-content">
        <p>Loading weather for <strong id="fixed-city">London</strong>…</p>
      </div>
    </section>

    <section id="search" class="card">
      <h2>Search City (5-day forecast)</h2>
      <form id="search-form">
        <input id="city-input" type="search" placeholder="Enter city name" aria-label="City name" required />
        <button type="submit">Search</button>
      </form>
      <div id="forecast-content" class="forecast-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <small>Data from OpenWeatherMap. Built for Web Technologies course.</small>
  </footer>

  <script type="module" src="./src/script.mjs"></script>
</body>
</html>
